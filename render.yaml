services:
  - type: web
    name: lumera-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PAYMENT_PROVIDER
        value: mock
      - key: EMAIL_DRIVER
        value: console
      - key: DB_CLIENT
        value: pg
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: lumera-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: 28800
      - key: ADMIN_EMAIL
        value: admin@lumera.test
      - key: ADMIN_PASSWORD
        value: lumera-admin
      - key: APP_URL
        fromGateway: lumera
      - key: CORS_ORIGINS
        fromGateway: lumera

databases:
  - type: postgres
    name: lumera-db
    plan: free

gateways:
  - name: lumera
    domain: lumera-api.onrender.com
